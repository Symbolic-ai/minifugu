[package]
name = "minifugu"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "A keyless local Turbopuffer API emulator with vector and BM25 search"
repository = "https://github.com/Symbolic-ai/minifugu"
readme = "README.md"
keywords = ["turbopuffer", "emulator", "vector-search", "bm25", "testing"]
categories = ["development-tools::testing", "database-implementations"]

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
half = "2"
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
alyze = "0.1.5"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
