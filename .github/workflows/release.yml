name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to retry publication or asset upload
        required: false
        type: string

concurrency:
  group: minifugu-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    # Release Please writes with the minted App token, not GITHUB_TOKEN.
    # A new step that writes with GITHUB_TOKEN must widen this block.
    permissions:
      contents: read
    outputs:
      released: ${{ steps.resolve.outputs.released }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: github.event_name == 'push' || inputs.tag == ''
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        if: github.event_name == 'push' || inputs.tag == ''
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName >/dev/null
            tag="$INPUT_TAG"
          elif [ "$CREATED" = true ]; then
            tag="$RELEASE_TAG"
          else
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'released=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-crate:
    if: needs.release-please.outputs.released == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Read pinned Rust version
        id: toolchain
        shell: bash
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "minifugu") | .version')"
          test "$RELEASE_TAG" = "v$package_version"
          cargo package --locked
      - name: Check whether this version is already published
        id: existing
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl --silent --show-error --retry 3 \
            -H 'User-Agent: minifugu-release (https://github.com/Symbolic-ai/minifugu)' \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/minifugu/$version")"
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.existing.outputs.published == 'false'
        id: auth
      - name: Publish to crates.io
        if: steps.existing.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  release-binaries:
    if: needs.release-please.outputs.released == 'true' && needs.publish-crate.result == 'success'
    needs: [release-please, publish-crate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: minifugu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: minifugu
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: minifugu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: minifugu.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Read pinned Rust version
        id: toolchain
        shell: bash
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked
      - name: Package and upload binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="minifugu-$RELEASE_TAG-$TARGET.tar.gz"
          tar -czf "$asset" -C target/release "$BINARY"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber
