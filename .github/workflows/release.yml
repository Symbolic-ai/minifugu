name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to retry publication or asset upload
        required: false
        type: string

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.resolve.outputs.released }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push' || inputs.tag == ''
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].headBranchName' <<< "$PRS" | while IFS= read -r branch; do
            gh workflow run ci.yml --ref "$branch"
          done
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release view "$INPUT_TAG" --json tagName --jq .tagName >/dev/null
            tag="$INPUT_TAG"
          elif [ "$CREATED" = true ]; then
            tag="$RELEASE_TAG"
          else
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'released=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-crate:
    if: needs.release-please.outputs.released == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "minifugu") | .version')"
          test "$RELEASE_TAG" = "v$package_version"
          cargo package --locked
      - name: Check whether this version is already published
        id: existing
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl --silent --show-error --retry 3 \
            -H 'User-Agent: minifugu-release (https://github.com/Symbolic-ai/minifugu)' \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/minifugu/$version")"
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.existing.outputs.published == 'false'
        id: auth
      - name: Publish to crates.io
        if: steps.existing.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  release-binaries:
    if: needs.release-please.outputs.released == 'true'
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: minifugu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: minifugu
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: minifugu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: minifugu.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package and upload binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          asset="minifugu-$RELEASE_TAG-$TARGET.tar.gz"
          tar -czf "$asset" -C target/release "$BINARY"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --clobber
